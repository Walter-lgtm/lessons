<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кровообращение у позвоночных (8 класс)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Кровообращение у позвоночных</h1>
      <p>8 класс. УМК Пасечник (базовый уровень)</p>
    </header>

    <!-- Экран ввода данных -->
    <section id="start-screen" class="screen">
      <h2>Начнём работу</h2>
      <form id="student-form">
        <div class="form-group">
          <label for="student-name">ФИО ученика:</label>
          <input type="text" id="student-name" required placeholder="Иванов Иван" />
        </div>
        <div class="form-group">
          <label for="student-class">Класс:</label>
          <input type="text" id="student-class" required placeholder="8А" />
        </div>
        <button type="submit" class="btn-primary">Начать тест</button>
      </form>
    </section>

    <!-- Экран теста -->
    <section id="quiz-screen" class="screen hidden">
      <div id="question-block">
        <!-- Вопросы будут вставлены через JS -->
      </div>
      <div class="quiz-controls">
        <button id="check-btn" class="btn-primary">Проверить ответы</button>
        <button id="next-btn" class="btn-secondary hidden">Далее</button>
      </div>
      <div id="feedback-area" class="feedback"></div>
    </section>

    <!-- Экран результатов -->
    <section id="results-screen" class="screen hidden">
      <h2>Результаты работы</h2>
      <div id="results-content"></div>
      <button id="restart-btn" class="btn-primary">Пройти заново</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
