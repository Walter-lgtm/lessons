<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный урок биологии</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #e8f5e9 100%);
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #2e7d32;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #616161;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-video {
            background-color: #0288d1;
            box-shadow: 0 4px 12px rgba(2, 136, 209, 0.3);
        }
        .btn-video:hover {
            background-color: #01579b;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 136, 209, 0.4);
        }
        .btn-quiz {
            background-color: #43a047;
            box-shadow: 0 4px 12px rgba(67, 160, 71, 0.3);
        }
        .btn-quiz:hover {
            background-color: #2e7d32;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(67, 160, 71, 0.4);
        }
        .btn-video:active, .btn-quiz:active {
            transform: translateY(0);
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #9e9e9e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Урок биологии</h1>
        <p>Добро пожаловать! Выберите нужное действие для начала занятия:</p>
        
        <!-- Замените ССЫЛКА_НА_ВИДЕО на реальную ссылку Облака Mail.ru -->
        <a href="https://cloud.mail.ru/public/EMaS/SXopEvYad" target="_blank" class="menu-btn btn-video">📺 Посмотреть видеоурок</a>
        
        <!-- Замените ССЫЛКА_НА_ТЕСТ на вашу ссылку запуска на GitHub Pages -->
        <a href="https://walter-lgtm.github.io/lessons/bio/8/ls/06/index.html" target="_blank" class="menu-btn btn-quiz">📝 Проверить свои знания</a>
        
        <div class="footer">
            Удачи на уроке!
        </div>
    </div>

</body>
</html>
