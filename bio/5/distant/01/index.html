<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учим уроки вместе с Локи</title>
    <!-- Подключаем шрифты: Асгардский Cinzel и дружелюбный Comfortaa -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@700;900&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный контейнер всего приложения -->
    <div class="menu-container">
        
        <!-- Заголовок, который будет виден всегда вверху -->
        <header class="menu-header">
            <h1 class="game-title">УЧИМ УРОКИ ВМЕСТЕ С ЛОКИ</h1>
        </header>

        <!-- Блок с интерактивным видео (оживший Локи) -->
        <!-- По умолчанию имеет класс полноэкранного режима full-screen -->
        <div id="video-wrapper" class="video-box full-screen">
            <!-- Кнопка-заглушка для обхода защиты звука в браузерах -->
            <div id="start-overlay" class="overlay-trigger">
                <button class="start-play-btn">НАЧАТЬ УРОК С ЛОКИ</button>
            </div>
            <video id="loki-video" playsinline>
                <source src="videos/loki_welcome.mp4" type="video/mp4">
                Ваш браузер не поддерживает видео.
            </video>
        </div>

        <!-- Навигация: Кнопки меню (появляются ПОСЛЕ завершения видео) -->
        <main id="menu-navigation" class="menu-navigation hidden">
            
            <!-- Кнопка 1: Урок (если нужно еще раз пересмотреть или открыть материалы) -->
            <button class="menu-btn" data-url="lesson/index.html">
                <span class="btn-text">Учить уроки вместе с Локи</span>
                <span class="btn-glow"></span>
            </button>

            <!-- Кнопка 2: Конспект -->
            <button class="menu-btn" data-url="notes/index.html">
                <span class="btn-text">Запишем в конспект знания</span>
                <span class="btn-glow"></span>
            </button>

            <!-- Кнопка 3: Тест/Проверка знаний -->
            <button class="menu-btn" data-url="quiz/index.html">
                <span class="btn-text">Проверить свои биомагические навыки</span>
                <span class="btn-glow"></span>
            </button>

            <!-- Кнопка 4: Домашнее задание -->
            <button class="menu-btn" data-url="homework/index.html">
                <span class="btn-text">Домашнее задание</span>
                <span class="btn-glow"></span>
            </button>

            <!-- Новая Кнопка 1: Техника безопасности -->
            <button class="menu-btn" data-url="safety/index.html">
                <span class="btn-text">Повтори правила техники безопасности</span>
                <span class="btn-glow"></span>
            </button>
            
        </main>

        <!-- Скромный футер для баланса композиции -->
        <footer class="menu-footer">
            <p>© Дистанционный урок биологии, 5 класс</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
