<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учим уроки вместе с Локи</title>
    <!-- Подключаем шрифты: Асгардский Cinzel и дружелюбный Comfortaa -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@700;900&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Новое модальное окно: Асгардский регистратор посещаемости -->
    <div id="attendance-modal" class="attendance-overlay">
        <div class="attendance-card">
            <h2 class="attendance-title">ОТМЕТЬСЯ, ЧТО ПРИШЁЛ НА УРОК</h2>
            <p class="attendance-subtitle">Локи должен записать твоё имя в свитки Асгарда!</p>
            
            <form id="attendance-form" onsubmit="return false;">
                <div class="input-field-group">
                    <label for="student-fio">Твои Фамилия и Имя:</label>
                    <input type="text" id="student-fio" required autocomplete="off">
                </div>

                <div class="input-field-group">
                    <label for="student-class">Твой класс:</label>
                    <input type="text" id="student-class" required autocomplete="off">
                </div>

                <button type="submit" id="submit-attendance-btn" class="enter-lesson-btn">ВОЙТИ НА УРОК</button>
            </form>
        </div>
    </div>

    <!-- Главный контейнер всего приложения -->
    <div class="menu-container">
        
        <!-- Заголовок, который будет виден всегда вверху -->
        <header class="menu-header">
            <h1 class="game-title">УЧИМ УРОКИ ВМЕСТЕ С ЛОКИ</h1>
        </header>

        <!-- Блок с интерактивным Локи (видео-интро) -->
        <div id="video-wrapper" class="video-box full-screen">
            <!-- Кнопка-запуск интерактива -->
            <div id="start-overlay" class="overlay-trigger">
                <button class="start-play-btn">НАЧАТЬ УРОК С ЛОКИ</button>
            </div>
            
            <!-- Короткое живое видео Локи (крутится бесконечно благодаря loop и без звука muted) -->
            <video id="loki-video" loop muted playsinline>
                <source src="videos/loki_idle.mp4" type="video/mp4">
                Ваш браузер не поддерживает видео.
            </video>
            
            <!-- ВОТ ЭТА СТРОКА: Магическая аудиодорожка приветствия -->
            <audio id="loki-audio">
                <source src="videos/loki_welcome.mp3" type="audio/mpeg">
                Ваш браузер не поддерживает аудио.
            </audio>
        </div>

        <!-- Навигация: Кнопки меню (появляются ПОСЛЕ завершения видео) -->
        <main id="menu-navigation" class="menu-navigation hidden">
            
            <!-- Кнопка 1: Урок (если нужно еще раз пересмотреть или открыть материалы) -->
            <button class="menu-btn" data-url="lesson/index.html">
                <span class="btn-text">Учить уроки вместе с Локи</span>
                <span class="btn-glow"></span>
            </button>

            <!-- Кнопка 2: Конспект -->
            <button class="menu-btn" data-url="notes/index.html">
                <span class="btn-text">Запишем в конспект знания</span>
                <span class="btn-glow"></span>
            </button>

            <!-- Кнопка 3: Тест/Проверка знаний -->
            <button class="menu-btn" data-url="quiz/index.html">
                <span class="btn-text">Проверить свои биомагические навыки</span>
                <span class="btn-glow"></span>
            </button>

            <!-- Кнопка 4: Домашнее задание -->
            <button class="menu-btn" data-url="homework/index.html">
                <span class="btn-text">Домашнее задание</span>
                <span class="btn-glow"></span>
            </button>

            <!-- Новая Кнопка 1: Техника безопасности -->
            <button class="menu-btn" data-url="safety/index.html">
                <span class="btn-text">Повтори правила техники безопасности</span>
                <span class="btn-glow"></span>
            </button>
            
        </main>

        <!-- Скромный футер для баланса композиции -->
        <footer class="menu-footer">
            <p>© Дистанционный урок биологии, 5 класс</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
