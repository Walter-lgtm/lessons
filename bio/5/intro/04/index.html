<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка знаний по теме "Введение в биологию"</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Экран авторизации ученика -->
    <div id="auth-screen" class="terminal-block">
        <h2>Проверочная работа</h2>
        <p class="system-msg">Тема: «Введение в биологию». Система сформирует случайный вариант из 15 заданий.</p>
        <div class="input-group">
            <label for="student-name">Фамилия и имя:</label>
            <input type="text" id="student-name" placeholder="Иванов Иван" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="student-class">Класс:</label>
            <input type="text" id="student-class" placeholder="5А" autocomplete="off">
        </div>
        <button id="start-btn" class="hl-btn">Начать работу</button>
    </div>

    <!-- Основной контейнер контрольной работы -->
    <div id="quiz-container" class="hidden">
        <header class="hl-header">
            <div class="logo">🌿</div>
            <div class="title-block">
                <h1>БИОЛОГИЯ</h1>
                <p>Проверочная работа: Введение в биологию</p>
            </div>
        </header>

        <!-- СЮДА СКРИПТ САМ ПОДГРУЗИТ 15 СЛУЧАЙНЫХ ВОПРОСОВ -->
        <div id="dynamic-tasks-area"></div>

        <!-- Кнопка отправки результатов -->
        <div class="submit-wrapper">
            <button id="submit-quiz-btn" class="hl-btn final-btn">Проверить и отправить результаты</button>
        </div>
    </div>

    <!-- Финальный экран результатов -->
    <div id="result-screen" class="terminal-block hidden">
        <h2>Работа завершена</h2>
        <p class="system-msg">Результаты успешно сохранены.</p>
        <div class="score-board">
            <p>Ученик: <span id="res-name"></span></p>
            <p>Класс: <span id="res-class"></span></p>
            <p class="total-score">ИТОГОВЫЙ БАЛЛ: <span id="res-score">0</span> / 15</p>
            <p class="total-score" style="margin-top: 10px;">ОЦЕНКА: <span id="res-grade" style="font-size: 1.5rem; text-decoration: underline;">-</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
