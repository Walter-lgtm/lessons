<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>§2. Биология — система наук о живой природе</title>
    <link rel="stylesheet" href="style.css">

<body>

    <!-- Экран ввода данных ученика -->
    <div id="auth-screen" class="bio-card">

            <h2>Регистрация участника</h2>
        </div>
        <p class="card-subtitle">Заполните данные, чтобы приступить к заданиям.</p>
        <div class="input-group">
            <label for="student-name">Фамилия и имя:</label>
            <input type="text" id="student-name" placeholder="Иванов Иван" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="student-class">Класс:</label>
            <input type="text" id="student-class" placeholder="5А" autocomplete="off">
        </div>
        <button id="start-btn" class="btn-primary">Начать работу</button>
    </div>

    <!-- Основной контейнер с заданиями -->
    <div id="quiz-container" class="hidden">
        <header class="page-header">
            <div class="header-badge">
